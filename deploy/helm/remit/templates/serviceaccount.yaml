# The pods' identity. The annotation and label are what Azure Workload Identity keys on:
# the webhook injects the federated token, and the CSI driver exchanges it for a Key Vault token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "remit.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ .Values.identity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.identity.tenantId | quote }}
