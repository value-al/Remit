apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  labels:
    {{- include "remit.labels" . | nindent 4 }}
    app.kubernetes.io/name: ledger
spec:
  replicas: {{ .Values.ledger.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ledger
          image: {{ .Values.image.registry }}/remit/ledger:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "remit.commonEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: remit-secrets
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.ledger.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: remit-keyvault
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  labels:
    {{- include "remit.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ledger
  ports:
    - name: http
      port: 80
      targetPort: http
