{{- if .Values.jaeger.enabled }}
# Tracing backend for the reference deployment. In-memory, all-in-one: enough to see one trace
# run from Funding to Ledger. Production points Otel__Endpoint at a collector instead.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    {{- include "remit.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
    - { name: ui, port: 16686 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    {{- include "remit.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image }}
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
{{- end }}
