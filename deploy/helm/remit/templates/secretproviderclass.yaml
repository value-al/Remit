# Pulls the named Key Vault secrets into the pod as files and mirrors them into a Kubernetes
# Secret (remit-secrets) so they can be injected as environment variables. The Secret exists
# only while a pod mounts the volume; nothing is stored in the chart or in git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: remit-keyvault
  labels:
    {{- include "remit.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.identity.clientId | quote }}
    tenantId: {{ .Values.identity.tenantId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    objects: |
      array:
        - |
          objectName: ConnectionStrings--Funding
          objectType: secret
        - |
          objectName: ConnectionStrings--Ledger
          objectType: secret
        - |
          objectName: Psp--Providers--alpha--WebhookSecret
          objectType: secret
        - |
          objectName: Psp--Providers--beta--WebhookSecret
          objectType: secret
  secretObjects:
    - secretName: remit-secrets
      type: Opaque
      data:
        - objectName: ConnectionStrings--Funding
          key: ConnectionStrings__Funding
        - objectName: ConnectionStrings--Ledger
          key: ConnectionStrings__Ledger
        - objectName: Psp--Providers--alpha--WebhookSecret
          key: Psp__Providers__alpha__WebhookSecret
        - objectName: Psp--Providers--beta--WebhookSecret
          key: Psp__Providers__beta__WebhookSecret
