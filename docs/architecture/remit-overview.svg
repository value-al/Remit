<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="One deposit through Remit: the client posts with an idempotency key, Funding routes the charge to a payment provider and verifies the provider's signed webhook, writes the deposit and its outbox row in one transaction, a relay publishes to RabbitMQ, the ledger consumes through an inbox and posts a balanced journal entry, and reconciliation matches the provider's month-end statement on the reference. Trust boundaries: the internet on the left, the cluster on the right; card data never enters." font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="currentColor" style="max-width:100%;height:auto">
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
    <marker id="rb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6a23c"/></marker>
  </defs>

  <!-- boundaries -->
  <text x="30" y="68" font-size="12" font-weight="700" opacity="0.7">INTERNET</text>
  <text x="30" y="84" opacity="0.6">clients · providers · TLS</text>
  <rect x="280" y="50" width="705" height="480" rx="6" fill="none" stroke="currentColor" stroke-dasharray="6 5" opacity="0.5"/>
  <text x="292" y="68" font-size="12" font-weight="700" opacity="0.7">REMIT</text>
  <text x="292" y="84" opacity="0.6">one PostgreSQL schema per service · one trace per movement · no card data anywhere</text>

  <!-- client -->
  <rect x="30" y="100" width="170" height="64" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
  <text x="115" y="126" text-anchor="middle" font-size="13" font-weight="700">Client app</text>
  <text x="115" y="146" text-anchor="middle" opacity="0.7">web · mobile</text>

  <!-- provider -->
  <rect x="30" y="360" width="200" height="84" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
  <text x="130" y="386" text-anchor="middle" font-size="13" font-weight="700">Payment provider</text>
  <text x="130" y="406" text-anchor="middle" opacity="0.7">tokenises cards</text>
  <text x="130" y="424" text-anchor="middle" opacity="0.7">PCI scope ends here</text>

  <!-- funding -->
  <rect x="300" y="100" width="290" height="230" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
  <text x="316" y="124" font-size="13" font-weight="700">Funding</text>
  <rect x="312" y="138" width="72" height="22" rx="11" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="348" y="153" text-anchor="middle">Requested</text>
  <text x="392" y="153" text-anchor="middle">→</text>
  <rect x="400" y="138" width="80" height="22" rx="11" fill="none" stroke="currentColor" opacity="0.8"/>
  <text x="440" y="153" text-anchor="middle">Submitted</text>
  <text x="488" y="153" text-anchor="middle">→</text>
  <rect x="496" y="138" width="54" height="22" rx="11" fill="none" stroke="#e6a23c"/>
  <text x="523" y="153" text-anchor="middle">Settled</text>
  <text x="316" y="184">closed edges — no double settle</text>
  <text x="316" y="208">idempotency_keys — replay · 409 · 422</text>
  <text x="316" y="232">deposit + outbox row — one transaction</text>
  <text x="316" y="256">relay — SKIP LOCKED, publisher confirms</text>
  <text x="316" y="280">webhook verified before parsing (Countersign)</text>
  <text x="316" y="304">PSP routed by currency, then observed health</text>

  <!-- broker -->
  <rect x="630" y="170" width="110" height="64" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
  <text x="685" y="196" text-anchor="middle" font-size="13" font-weight="700">RabbitMQ</text>
  <text x="685" y="216" text-anchor="middle" opacity="0.7">topic exchange</text>
  <text x="685" y="160" text-anchor="middle" font-size="10" fill="#e6a23c">outbox → relay → publish</text>
  <text x="660" y="254" text-anchor="middle" font-size="10" opacity="0.7">traceparent in headers</text>

  <!-- ledger -->
  <rect x="800" y="100" width="185" height="120" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
  <text x="816" y="124" font-size="13" font-weight="700">Ledger</text>
  <text x="816" y="150">inbox — message id, same tx</text>
  <text x="816" y="174">journal — balanced entries</text>
  <text x="816" y="198">balance = Σ postings</text>

  <!-- reconciliation -->
  <rect x="800" y="320" width="185" height="140" rx="4" fill="currentColor" fill-opacity="0.06" stroke="currentColor"/>
  <text x="816" y="344" font-size="13" font-weight="700">Reconciliation</text>
  <text x="816" y="370">movements from events</text>
  <text x="816" y="394">statement ⇄ reference only</text>
  <text x="816" y="418">exceptions — humans resolve</text>
  <text x="816" y="442">stuck sweep</text>

  <!-- 1 client -> funding -->
  <line x1="200" y1="132" x2="298" y2="132" stroke="currentColor" stroke-width="1.5" marker-end="url(#ra)"/>
  <text x="249" y="120" text-anchor="middle" font-size="10">POST /deposits</text>
  <text x="249" y="148" text-anchor="middle" font-size="10">Idempotency-Key</text>

  <!-- 2 funding -> provider: charge -->
  <line x1="300" y1="262" x2="232" y2="372" stroke="currentColor" stroke-width="1.5" marker-end="url(#ra)"/>
  <text x="248" y="300" text-anchor="end" font-size="10">charge</text>
  <text x="248" y="313" text-anchor="end" font-size="10">Accepted · Rejected · Unavailable</text>

  <!-- 3 provider -> funding: webhook -->
  <line x1="232" y1="416" x2="300" y2="314" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ra)"/>
  <text x="300" y="352" font-size="10">webhook — HMAC over raw bytes</text>
  <text x="300" y="365" font-size="10">per-provider secret · 5-min window</text>

  <!-- 4 funding -> broker -->
  <line x1="590" y1="202" x2="628" y2="202" stroke="#e6a23c" stroke-width="2" marker-end="url(#rb)"/>

  <!-- 5 broker -> ledger -->
  <line x1="740" y1="190" x2="798" y2="164" stroke="#e6a23c" stroke-width="2" marker-end="url(#rb)"/>
  <text x="770" y="208" text-anchor="middle" font-size="10" fill="#e6a23c">settled</text>

  <!-- 6 broker -> reconciliation -->
  <line x1="740" y1="216" x2="798" y2="360" stroke="currentColor" stroke-width="1.5" marker-end="url(#ra)"/>
  <text x="768" y="300" text-anchor="end" font-size="10">funding.#</text>

  <!-- 7 provider -> reconciliation: statement -->
  <polyline points="130,444 130,500 892,500 892,462" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ra)"/>
  <text x="511" y="492" text-anchor="middle" font-size="10">month-end statement (CSV) — matched on the provider reference, differences become exceptions</text>
</svg>
