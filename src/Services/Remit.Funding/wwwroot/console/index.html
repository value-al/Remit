<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Remit console</title>
<style>
  :root { --bg:#0e0d0b; --panel:#171512; --ink:#ece7dc; --muted:#9a927f; --accent:#e6a23c; --ok:#6fcf97; --bad:#ef6f6c; --line:#2a2722; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap }
  header h1 { margin:0; font-size:18px; letter-spacing:.02em } header h1 span { color:var(--accent) }
  header p { margin:0; color:var(--muted) }
  main { display:grid; grid-template-columns:minmax(320px,420px) 1fr; gap:0; min-height:calc(100vh - 60px) }
  .side { border-right:1px solid var(--line); padding:16px 20px; overflow:auto }
  .log { padding:16px 20px; overflow:auto; background:#0b0a09 }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 14px; padding:10px 12px }
  legend { color:var(--accent); padding:0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase }
  label { display:block; color:var(--muted); font-size:12px; margin:8px 0 2px }
  input, select, textarea { width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font:inherit }
  textarea { min-height:70px; resize:vertical }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px }
  button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:6px 10px; font:inherit; cursor:pointer }
  button:hover { border-color:var(--accent) } button.primary { background:var(--accent); color:#1a1408; border-color:var(--accent); font-weight:600 }
  .entry { border-left:3px solid var(--line); padding:6px 10px; margin:0 0 10px; white-space:pre-wrap; word-break:break-word }
  .entry.ok { border-color:var(--ok) } .entry.bad { border-color:var(--bad) } .entry .t { color:var(--muted); font-size:12px }
  .entry .s { font-weight:700 } .ok .s { color:var(--ok) } .bad .s { color:var(--bad) }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px; color:var(--muted); margin-top:6px }
  .kv b { color:var(--ink); font-weight:500; word-break:break-all }
  @media (max-width:820px) { main { grid-template-columns:1fr } .side { border-right:0; border-bottom:1px solid var(--line) } }
</style>
</head>
<body>
<header>
  <h1><span>Remit</span> console</h1>
  <p>Drives a running Remit from the browser. Source of truth: <code>src/Services/Remit.Funding/wwwroot/console/index.html</code> in the Remit repo.</p>
</header>
<main>
  <div class="side">
    <fieldset>
      <legend>Targets</legend>
      <label>Funding</label><input id="funding" value="http://localhost:5000">
      <label>Ledger</label><input id="ledger" value="http://localhost:5100">
      <label>Reconciliation</label><input id="recon" value="http://localhost:5200">
      <label>Webhook secret · alpha</label><input id="secret_alpha" value="whsec_alpha_dev">
      <label>Webhook secret · beta</label><input id="secret_beta" value="whsec_beta_dev">
      <div class="row"><button onclick="saveCfg()">Save</button><button onclick="probe()">Probe /health/ready on all three</button></div>
    </fieldset>

    <fieldset>
      <legend>1 · Deposit</legend>
      <label>Account id</label><input id="account">
      <div class="row" style="margin-top:2px"><button onclick="newAccount()">New account</button></div>
      <label>Amount</label><input id="amount" value="100">
      <label>Currency</label><select id="currency"><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option></select>
      <label>Idempotency-Key</label><input id="idem">
      <div class="row">
        <button class="primary" onclick="deposit(false)">POST /deposits</button>
        <button onclick="deposit(true)">Replay same key</button>
        <button onclick="depositMutated()">Same key, amount +1</button>
        <button onclick="getDeposit()">GET last deposit</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>2 · Provider webhook (signed in the browser)</legend>
      <div class="kv"><span>deposit</span><b id="last_dep">—</b><span>provider</span><b id="last_prov">—</b><span>reference</span><b id="last_ref">—</b></div>
      <label>Event id</label><input id="evt" value="evt_1">
      <label>Timestamp offset (seconds; −600 = stale replay)</label><input id="tsoff" value="0">
      <div class="row">
        <button class="primary" onclick="webhook('settled')">settled</button>
        <button onclick="webhook('failed')">failed</button>
        <button onclick="webhook('settled', true)">settled, forged key</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>3 · Ledger</legend>
      <div class="row"><button class="primary" onclick="balance()">GET balance</button><button onclick="entries()">GET entries for last movement</button></div>
    </fieldset>

    <fieldset>
      <legend>4 · Withdrawal</legend>
      <label>Amount</label><input id="wamount" value="40">
      <label>Destination token</label><input id="dest" value="bank-token-1">
      <div class="row"><button class="primary" onclick="withdraw()">POST /withdrawals</button><button onclick="withdrawalWebhook('paid')">paid webhook</button><button onclick="withdrawalWebhook('failed')">failed webhook</button></div>
    </fieldset>

    <fieldset>
      <legend>5 · Reconciliation</legend>
      <label>Statement (CSV) — built from this session's settled movements; edit to break it</label>
      <textarea id="csv">reference,kind,amount,currency,settled_at</textarea>
      <div class="row"><button onclick="buildStatement()">Build from session</button><button class="primary" onclick="postStatement()">POST statement (alpha)</button><button onclick="exceptions()">GET open exceptions</button><button onclick="sweep()">Run stuck sweep</button></div>
      <label>Resolve exception id · reason</label><input id="exid" placeholder="exception id"><input id="exreason" placeholder="why" style="margin-top:4px">
      <div class="row"><button onclick="resolve()">POST resolve</button></div>
    </fieldset>
  </div>
  <div class="log" id="log"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const S = { last: null, lastKind: null, settled: [] };
const cfgKeys = ['funding','ledger','recon','secret_alpha','secret_beta'];
try { const c = JSON.parse(localStorage.getItem('remit-console') || '{}'); cfgKeys.forEach(k => { if (c[k]) $(k).value = c[k]; }); } catch {}
function saveCfg() { const c = {}; cfgKeys.forEach(k => c[k] = $(k).value); try { localStorage.setItem('remit-console', JSON.stringify(c)); } catch {} log('ok', 'config saved'); }
function uuid() { return crypto.randomUUID(); }
function newAccount() { $('account').value = uuid(); $('idem').value = uuid(); }
if (!$('account').value) newAccount();

function log(kind, title, body, extra) {
  const el = document.createElement('div'); el.className = 'entry ' + kind;
  const t = new Date().toISOString().slice(11, 19);
  el.innerHTML = `<div class="t">${t}</div><div class="s"></div><div class="b"></div>`;
  el.querySelector('.s').textContent = title;
  el.querySelector('.b').textContent = typeof body === 'string' ? body : (body === undefined ? '' : JSON.stringify(body, null, 2));
  if (extra) { const x = document.createElement('div'); x.className = 't'; x.textContent = extra; el.appendChild(x); }
  const L = $('log'); L.prepend(el);
}

async function call(base, method, path, { body, headers = {}, raw } = {}) {
  const url = $(base).value.replace(/\/$/, '') + path;
  const init = { method, headers: { ...headers } };
  if (raw !== undefined) { init.body = raw; }
  else if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
  const started = performance.now();
  try {
    const r = await fetch(url, init);
    const text = await r.text(); let json; try { json = JSON.parse(text); } catch { json = text; }
    const ms = Math.round(performance.now() - started);
    const replayed = r.headers.get('Idempotent-Replayed');
    log(r.ok ? 'ok' : 'bad', `${method} ${path} → ${r.status}${replayed ? ' (Idempotent-Replayed)' : ''}`, json, `${url} · ${ms} ms`);
    return { ok: r.ok, status: r.status, json };
  } catch (e) {
    log('bad', `${method} ${path} → network error`, String(e), `${url} — is the service running, and does it allow this origin (CORS)?`);
    return { ok: false, status: 0, json: null };
  }
}

async function probe() { for (const b of ['funding','ledger','recon']) await call(b, 'GET', '/health/ready'); }

async function deposit(replay) {
  if (!replay) $('idem').value = uuid();
  const body = { accountId: $('account').value, amount: Number($('amount').value), currency: $('currency').value };
  const r = await call('funding', 'POST', '/deposits/', { body, headers: { 'Idempotency-Key': $('idem').value } });
  if (r.ok && r.json && r.json.id) remember('deposit', r.json);
}
async function depositMutated() {
  const body = { accountId: $('account').value, amount: Number($('amount').value) + 1, currency: $('currency').value };
  await call('funding', 'POST', '/deposits/', { body, headers: { 'Idempotency-Key': $('idem').value } });
}
async function getDeposit() { if (S.last) await call('funding', 'GET', `/${S.lastKind}s/${S.last.id}`); else log('bad', 'no deposit yet'); }

function remember(kind, m) {
  S.last = m; S.lastKind = kind;
  $('last_dep').textContent = m.id; $('last_prov').textContent = m.provider || '—'; $('last_ref').textContent = m.pspReference || '—';
}

async function hmacHex(secret, message) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(message));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function signedWebhook(provider, payload, forged) {
  const body = JSON.stringify(payload);
  const ts = String(Math.floor(Date.now() / 1000) + Number($('tsoff').value || 0));
  const secret = forged ? 'not-the-secret' : $('secret_' + provider).value;
  const sig = await hmacHex(secret, `${ts}.${body}`);
  return call('funding', 'POST', `/webhooks/psp/${provider}`, { raw: body, headers: { 'Content-Type': 'application/json', 'X-Timestamp': ts, 'X-Signature': sig } });
}

async function webhook(status, forged) {
  if (!S.last || S.lastKind !== 'deposit') return log('bad', 'create a deposit first');
  const payload = { eventId: $('evt').value, depositId: S.last.id, reference: S.last.pspReference, status };
  if (status === 'failed') payload.reason = 'issuer declined';
  const r = await signedWebhook(S.last.provider, payload, forged);
  if (r.ok && r.json && r.json.applied && status === 'settled') S.settled.push({ ref: S.last.pspReference, kind: 'deposit', amount: S.last.amount, currency: S.last.currency, at: new Date().toISOString() });
}

async function balance() { await call('ledger', 'GET', `/accounts/${$('account').value}/balance?currency=${$('currency').value}`); }
async function entries() { if (S.last) await call('ledger', 'GET', `/entries?correlationId=${S.last.id}`); else log('bad', 'no movement yet'); }

async function withdraw() {
  const body = { accountId: $('account').value, amount: Number($('wamount').value), currency: $('currency').value, destination: $('dest').value };
  const r = await call('funding', 'POST', '/withdrawals/', { body, headers: { 'Idempotency-Key': uuid() } });
  if (r.ok && r.json && r.json.id) remember('withdrawal', r.json);
}
async function withdrawalWebhook(status) {
  if (!S.last || S.lastKind !== 'withdrawal') return log('bad', 'create a withdrawal first');
  const payload = { eventId: $('evt').value, withdrawalId: S.last.id, reference: S.last.pspReference, status };
  if (status === 'failed') payload.reason = 'payout rejected';
  const r = await signedWebhook(S.last.provider, payload, false);
  if (r.ok && r.json && r.json.applied && status === 'paid') S.settled.push({ ref: S.last.pspReference, kind: 'withdrawal', amount: S.last.amount, currency: S.last.currency, at: new Date().toISOString() });
}

function buildStatement() {
  const rows = S.settled.map(s => `${s.ref},${s.kind},${s.amount},${s.currency},${s.at}`);
  $('csv').value = ['reference,kind,amount,currency,settled_at', ...rows].join('\n');
  log('ok', `statement built from ${rows.length} settled movement(s) in this session`);
}
async function postStatement() {
  const now = new Date(); const from = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
  const to = new Date(now.getFullYear(), now.getMonth() + 1, 1).toISOString().slice(0, 10);
  await call('recon', 'POST', `/statements/alpha?from=${from}&to=${to}`, { raw: $('csv').value, headers: { 'Content-Type': 'text/csv' } });
}
async function exceptions() { await call('recon', 'GET', '/exceptions?open=true'); }
async function sweep() { await call('recon', 'POST', '/sweeps/stuck', { raw: '' }); }
async function resolve() { await call('recon', 'POST', `/exceptions/${$('exid').value}/resolve`, { body: { resolution: $('exreason').value } }); }

log('ok', 'Remit console ready', 'Start with docker compose up -d and the three services, then Probe. Every request and response is logged here; secrets never leave this tab.');
</script>
</body>
</html>
